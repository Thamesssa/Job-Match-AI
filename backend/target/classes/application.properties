# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobmatch_ai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ML Microservice Configuration
ml.service.base-url=${ML_SERVICE_URL:http://localhost:8001}
ml.service.timeout=${ML_SERVICE_TIMEOUT:30000}

# Server Configuration
server.port=${PORT:8080}

# Rate Limiting
rate.limit.requests-per-minute=${RATE_LIMIT_RPM:100}

# Logging
logging.level.com.jobmatch.backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized